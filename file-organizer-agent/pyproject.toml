[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "file-organizer-agent"
version = "0.1.0"
description = "AI-assisted CLI that finds duplicate files and archives, and safely cleans them up."
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
organizer = "organizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
